version: 2.1

jobs:
  assert_segment_inner:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact E
          command: |
            mkdir -p /tmp/sloth
            set +o pipefail 2>/dev/null; dd if=/dev/urandom bs=256 count=2000 2>/dev/null | base64 > /tmp/sloth/374c697f77; true
            md5sum /tmp/sloth/374c697f77 | cut -c1-8
      - persist_to_workspace:
          root: /tmp/sloth
          paths:
            - '374c697f77'
  rollout:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/sloth
      - run:
          name: Verify step-4
          command: |
            { wc -c < /tmp/sloth/374c697f77; wc -l < /tmp/sloth/374c697f77; wc -w < /tmp/sloth/374c697f77; } 2>/dev/null | paste -sd' ' || true
      - run:
          name: Retrieve project
          command: git clone --depth 3 -q --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Materialize bundle
          command: tar -I bzip2 -xf extras-01.tar.bz2
      - run:
          command: "$PWD/ship-hook"
